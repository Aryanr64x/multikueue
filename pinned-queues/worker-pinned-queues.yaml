# Apply to: BOTH workers (worker-a and worker-b)
# MultiKueue copies the job to the worker with its label unchanged
# (e.g. queue-name: queue-worker-b), so the worker needs a LocalQueue with that name.
# Both point at the worker's existing cluster-queue, so the worker's real 4 CPU budget stays the single source of truth.
# Same file on both workers keeps them identical; manager never sends a queue-worker-b job to worker-a.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: default
  name: queue-worker-a
spec:
  clusterQueue: cluster-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: default
  name: queue-worker-b
spec:
  clusterQueue: cluster-queue